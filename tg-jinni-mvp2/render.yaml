services:
  - type: web
    name: tg-jinni-api
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthcheck
    autoDeploy: true
    envVars:
      # Secret values are intentionally NOT stored in this repository.
      # Render asks for sync:false values during initial Blueprint creation.
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: PAYMENT_PROVIDER_TOKEN
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: OWNERSHIP_RECHECK_HOURS
        value: "24"
      - key: TASK_HOLD_HOURS
        value: "48"
      - key: PROMOTION_PACKAGE_PRICE_RUB
        value: "180"
      - key: PROMOTION_PACKAGE_IMPRESSIONS
        value: "4500"
