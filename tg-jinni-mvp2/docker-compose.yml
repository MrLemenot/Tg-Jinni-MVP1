services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tg_jinni
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/tg_jinni
      ENVIRONMENT: development
    ports:
      - "8000:8000"

volumes:
  pgdata:
